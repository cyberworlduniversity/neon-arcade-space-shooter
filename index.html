<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Arcade Space Shooter</title><style>
:root{--c:#42f5ff;--p:#ff4fd8;--g:#a8ff5a;--panel:rgba(3,8,25,.9)}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02040d;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block}.screen{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#18235c66,#01030bf5 70%);z-index:10}.hidden{display:none!important}.card{width:min(94vw,720px);max-height:92vh;overflow:auto;padding:28px;text-align:center;border:1px solid #42f5ff55;border-radius:25px;background:var(--panel);box-shadow:0 0 80px #42f5ff22}.title{font-size:clamp(44px,10vw,84px);line-height:.85;margin:0 0 14px;font-weight:1000;letter-spacing:-4px;background:linear-gradient(90deg,var(--c),#fff,var(--p));color:transparent;background-clip:text}.sub{opacity:.7}.btn{border:0;border-radius:13px;padding:13px 20px;margin:5px;background:linear-gradient(90deg,#13d9ff,#9b5cff);color:#fff;font-weight:900;cursor:pointer}.btn.secondary{background:#ffffff12;border:1px solid #ffffff2b}.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:15px}.pill{padding:8px 11px;border:1px solid #ffffff22;border-radius:999px;background:#ffffff08;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:left;margin:18px 0}.item{padding:13px;border:1px solid #42f5ff25;border-radius:14px;background:#ffffff06}.item b{color:var(--c)}.item small{display:block;opacity:.65;margin:5px 0}.locked{opacity:.35;filter:grayscale(1)}#hud{position:fixed;inset:0;padding:12px;display:none;z-index:4;pointer-events:none}.top{display:flex;gap:6px;justify-content:space-between}.stat{min-width:65px;padding:7px 9px;border:1px solid #42f5ff44;border-radius:11px;background:#050a1cbb;backdrop-filter:blur(7px)}.label{font-size:8px;opacity:.6;text-transform:uppercase}.value{font-weight:900;color:var(--c)}#health{color:var(--g)}#boss{display:none;position:absolute;top:82px;left:50%;transform:translateX(-50%);width:min(72vw,580px)}.bosslabel{text-align:center;font-size:10px;font-weight:900;letter-spacing:2px}.bar{height:13px;border-radius:20px;overflow:hidden;background:#210716;border:1px solid #ff4fd855}.fill{height:100%;background:linear-gradient(90deg,var(--p),#ff345c);width:100%}.msg{position:absolute;top:19%;left:50%;transform:translateX(-50%);font-weight:1000;font-size:clamp(18px,4vw,38px);letter-spacing:3px;text-shadow:0 0 20px var(--c);opacity:0;transition:.2s;white-space:nowrap}.pause{pointer-events:auto;position:fixed;right:12px;bottom:12px;padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid #fff3;color:#fff;font-weight:900}.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);opacity:.4;font-size:10px;white-space:nowrap}#touch{display:none;position:fixed;inset:auto 0 15px;padding:0 15px;justify-content:space-between;z-index:5;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,43px);grid-template-rows:repeat(3,43px);gap:4px}.touch{width:43px;height:43px;pointer-events:auto;border:1px solid #fff4;border-radius:12px;background:#081023bb;color:#fff}.fire{width:88px;height:88px;pointer-events:auto;border-radius:50%;border:2px solid var(--p);background:#ff4fd822;color:#fff;font-weight:1000}@media(max-width:700px){#touch{display:flex}.grid{grid-template-columns:1fr}.hint{display:none}.pause{bottom:115px}.stat{min-width:58px}.label{font-size:7px}}
</style></head><body>
<div id="start" class="screen"><div class="card"><h1 class="title">NEON<br>ARCADE</h1><p class="sub">REAL-TIME 3D SPACE SHOOTER · BOSS RUN</p><div class="stats"><span class="pill">LV <b id="ml">1</b></span><span class="pill">XP <b id="mx">0</b></span><span class="pill">CREDITS <b id="mc">0</b></span><span class="pill">HIGH <b id="mb">0</b></span></div><button id="startBtn" class="btn">START MISSION</button><button id="upBtn" class="btn secondary">UPGRADES</button><button id="achBtn" class="btn secondary">ACHIEVEMENTS</button><button id="soundBtn" class="btn secondary">SOUND: ON</button><p class="sub">WASD / ARROWS · SPACE FIRE · P PAUSE</p></div></div>
<div id="upScreen" class="screen hidden"><div class="card"><h2>SHIP & WEAPON UPGRADES</h2><div id="upList" class="grid"></div><button id="upBack" class="btn secondary">BACK</button></div></div><div id="achScreen" class="screen hidden"><div class="card"><h2>ACHIEVEMENTS</h2><div id="achList"></div><button id="achBack" class="btn secondary">BACK</button></div></div>
<div id="over" class="screen hidden"><div class="card"><h2 class="title" style="font-size:60px">MISSION OVER</h2><p id="final"></p><button id="again" class="btn">PLAY AGAIN</button><button id="menu" class="btn secondary">MAIN MENU</button></div></div>
<div id="hud"><div class="top"><div class="stat"><div class="label">Score</div><div id="score" class="value">0</div></div><div class="stat"><div class="label">Wave</div><div id="wave" class="value">1</div></div><div class="stat"><div class="label">Health</div><div id="hp" class="value">100</div></div><div class="stat"><div class="label">Weapon</div><div id="wep" class="value">L1</div></div><div class="stat"><div class="label">Credits</div><div id="cred" class="value">0</div></div></div><div id="boss"><div class="bosslabel">VOID TITAN · BOSS</div><div class="bar"><div id="bossFill" class="fill"></div></div></div><div id="msg" class="msg"></div><div class="hint">PROCEDURAL 3D · PARTICLES · AUDIO · VOICE · PERSISTENT PROGRESSION</div><button id="pause" class="pause">PAUSE</button></div>
<div id="touch"><div class="pad"><span></span><button class="touch" data-k="up">▲</button><span></span><button class="touch" data-k="left">◀</button><button class="touch" data-k="down">▼</button><button class="touch" data-k="right">▶</button></div><button id="fire" class="fire">FIRE</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const $=x=>document.getElementById(x),KEY='neonArcadeSaveV4';const base={level:1,xp:0,credits:0,best:0,damage:1,fire:1,shield:0,weapon:1,kills:0,bosses:0,total:0,waveBest:0,ach:{}};let save=load();let scene,camera,renderer,clock,player;let stars=[],shots=[],enemies=[],parts=[],drops=[],bossShots=[],boss=null;let run=false,paused=false,score=0,hp=100,wave=1,spawn=0,wtime=0,last=0,rapid=0,shake=0,sound=true,audio;let keys={};
function load(){try{return {...base,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return {...base}}}function saveIt(){localStorage.setItem(KEY,JSON.stringify(save));menu()}function menu(){$('ml').textContent=save.level;$('mx').textContent=save.xp;$('mc').textContent=save.credits;$('mb').textContent=save.best.toLocaleString()}
const ach=[['blood','First Blood','1 kill',()=>save.kills>=1],['wave','Wave Runner','wave 5',()=>save.waveBest>=5],['boss','Boss Breaker','defeat a boss',()=>save.bosses>=1],['arsenal','Arsenal','weapon level 5',()=>save.weapon>=5],['rich','Credit Hunter','1000 credits',()=>save.total>=1000],['veteran','Veteran','level 5',()=>save.level>=5]];
function init(){scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02040d,.011);camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,900);camera.position.set(0,3.8,12);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);clock=new THREE.Clock();scene.add(new THREE.AmbientLight(0x5666aa,1.5));let l=new THREE.PointLight(0x42f5ff,55,140);l.position.set(0,8,10);scene.add(l);starsInit();nebula();playerInit();events();menu();upgrades();achievements();loop()}
function starsInit(){let g=new THREE.BufferGeometry(),p=[];for(let i=0;i<2200;i++)p.push((Math.random()-.5)*210,(Math.random()-.5)*120,-Math.random()*280);g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));let s=new THREE.Points(g,new THREE.PointsMaterial({color:0xb9f5ff,size:.14,transparent:true,opacity:.85}));scene.add(s);stars.push(s)}function nebula(){for(let i=0;i<10;i++){let q=new THREE.Mesh(new THREE.SphereGeometry(8+Math.random()*8,16,16),new THREE.MeshBasicMaterial({color:[0x172d75,0x5b155d,0x0b5b63][i%3],transparent:true,opacity:.07,depthWrite:false}));q.position.set((Math.random()-.5)*35,(Math.random()-.5)*20,-70-Math.random()*140);scene.add(q)}}
function playerInit(){let g=new THREE.Group(),body=new THREE.Mesh(new THREE.ConeGeometry(.72,2.7,5),new THREE.MeshStandardMaterial({color:0x22d9ff,emissive:0x063b70,emissiveIntensity:2,metalness:.55,roughness:.2}));body.rotation.x=-Math.PI/2;g.add(body);let wing=new THREE.Mesh(new THREE.BoxGeometry(2.5,.12,.75),new THREE.MeshStandardMaterial({color:0xff4fd8,emissive:0x4b0038,emissiveIntensity:2.2}));wing.position.z=.25;g.add(wing);let ring=new THREE.Mesh(new THREE.TorusGeometry(.8,.045,8,24),new THREE.MeshBasicMaterial({color:0xa8ff5a}));ring.rotation.x=Math.PI/2;g.add(ring);let glow=new THREE.PointLight(0x42f5ff,9,16);glow.position.z=1.2;g.add(glow);g.position.set(0,0,5);player=g;scene.add(g)}
function audioOn(){if(!sound)return;if(!audio){let C=AudioContext||webkitAudioContext;audio=new C()}if(audio.state==='suspended')audio.resume()}function tone(f,d,t='sine',gain=.035,slide=0){if(!sound)return;audioOn();if(!audio)return;let o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(35,f+slide),n+d);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(gain,n+.008);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g).connect(audio.destination);o.start();o.stop(n+d+.02)}function voice(x){if(!sound||!speechSynthesis)return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x);u.rate=1.05;u.pitch=.8;u.volume=.5;speechSynthesis.speak(u)}catch{}}function sfx(n){if(n==='shot')tone(700,.05,'square',.025,-300);if(n==='hit')tone(120,.08,'sawtooth',.03,70);if(n==='pick'){tone(520,.1,'triangle',.04,180);setTimeout(()=>tone(820,.12,'triangle',.03,120),70)}if(n==='boom')tone(65,.3,'sawtooth',.05,-30);if(n==='level'){tone(440,.12,'triangle',.04,150);setTimeout(()=>tone(660,.15,'triangle',.04,180),100)}}
function burst(pos,col=0x42f5ff,n=12){for(let i=0;i<n;i++){let p=new THREE.Mesh(new THREE.SphereGeometry(.07,5,5),new THREE.MeshBasicMaterial({color:col,transparent:true}));p.position.copy(pos);p.userData={life:.4+Math.random()*.7,v:new THREE.Vector3((Math.random()-.5)*.2,(Math.random()-.5)*.2,(Math.random()-.5)*.2)};parts.push(p);scene.add(p)}}
function fireShot(){let n=performance.now(),cd=Math.max(48,135-(save.fire-1)*15)-(rapid>n?55:0);if(n-last<cd)return;last=n;sfx('shot');let count=save.weapon>=4?3:save.weapon>=2?2:1;for(let i=0;i<count;i++){let b=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),new THREE.MeshBasicMaterial({color:save.weapon>=5?0xa8ff5a:0x42f5ff}));b.position.copy(player.position);b.position.x+=(i-(count-1)/2)*.3;b.position.z-=1.5;b.userData.d=save.damage+Math.floor(save.weapon/3);shots.push(b);scene.add(b);burst(b.position,b.material.color.getHex(),3)}}
function enemy(){let r=Math.random(),e,u;if(r<.56){e=new THREE.Mesh(new THREE.OctahedronGeometry(.8),new THREE.MeshStandardMaterial({color:0xff4fd8,emissive:0x52002f,emissiveIntensity:2}));u={hp:1+Math.floor(wave/7),sp:.075+wave*.007,v:100}}else if(r<.86){e=new THREE.Mesh(new THREE.IcosahedronGeometry(1.1),new THREE.MeshStandardMaterial({color:0xff9d3b,emissive:0x4c1700,emissiveIntensity:1.8}));u={hp:2+Math.floor(wave/6),sp:.045+wave*.005,v:180}}else{e=new THREE.Mesh(new THREE.TetrahedronGeometry(1.1),new THREE.MeshStandardMaterial({color:0xa8ff5a,emissive:0x143b00,emissiveIntensity:2}));u={hp:3+Math.floor(wave/5),sp:.035+wave*.004,v:300}}e.userData=u;e.position.set((Math.random()-.5)*16,(Math.random()-.5)*8,-45-Math.random()*35);enemies.push(e);scene.add(e)}
function bossSpawn(){if(boss)return;let g=new THREE.Group();let core=new THREE.Mesh(new THREE.IcosahedronGeometry(2.7,1),new THREE.MeshStandardMaterial({color:0xff2c9c,emissive:0x650035,emissiveIntensity:2.7,metalness:.45}));g.add(core);let ring=new THREE.Mesh(new THREE.TorusGeometry(3.5,.16,12,48),new THREE.MeshBasicMaterial({color:0x42f5ff}));ring.rotation.x=Math.PI/2;g.add(ring);g.position.set(0,2,-48);g.userData={hp:120+wave*35,max:120+wave*35,t:0};boss=g;scene.add(g);$('boss').style.display='block';sfx('boom');voice('Warning. Boss incoming.');msg('BOSS INCOMING')}
function damageEnemy(e,d){e.userData.hp-=d;sfx('hit');burst(e.position,e.material.color.getHex(),5);shake=.15;if(e.userData.hp<=0){score+=e.userData.v;save.kills++;let c=Math.ceil(e.userData.v/20);save.xp+=25;save.credits+=c;save.total+=c;sfx('boom');burst(e.position,e.material.color.getHex(),24);if(Math.random()<.14)drop();scene.remove(e);enemies.splice(enemies.indexOf(e),1);progress()}}
function damageBoss(d){if(!boss)return;boss.userData.hp-=d;burst(boss.position,0xff4fd8,5);shake=.2;if(boss.userData.hp<=0){score+=2500;save.bosses++;save.xp+=300;save.credits+=250;save.total+=250;sfx('boom');burst(boss.position,0xff4fd8,90);scene.remove(boss);boss=null;$('boss').style.display='none';voice('Boss destroyed.');msg('BOSS DESTROYED');progress()}}
function drop(){let p=new THREE.Mesh(new THREE.TorusGeometry(.42,.11,8,18),new THREE.MeshBasicMaterial({color:0xa8ff5a}));p.position.set((Math.random()-.5)*13,(Math.random()-.5)*7,-40);p.userData={kind:Math.random()<.5?'health':'rapid',life:10};drops.push(p);scene.add(p)}
function progress(){while(save.xp>=save.level*250){save.xp-=save.level*250;save.level++;save.credits+=100;save.total+=100;sfx('level');voice('Level up.');msg('LEVEL UP +100 CREDITS')}for(let a of ach)if(!save.ach[a[0]]&&a[3]()){save.ach[a[0]]=Date.now();sfx('level');voice('Achievement unlocked. '+a[1]);msg('ACHIEVEMENT: '+a[1])}saveIt();achievements()}
function msg(x){$('msg').textContent=x;$('msg').style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>$('msg').style.opacity=0,1100)}
function clear(){for(let x of [...enemies,...shots,...parts,...drops,...bossShots])scene.remove(x);if(boss)scene.remove(boss);enemies=[];shots=[];parts=[];drops=[];bossShots=[];boss=null;$('boss').style.display='none'}
function start(){audioOn();clear();score=0;hp=Math.min(100,100+save.shield*10);wave=1;spawn=0;wtime=0;rapid=0;player.position.set(0,0,5);run=true;paused=false;$('start').classList.add('hidden');$('over').classList.add('hidden');$('hud').style.display='block';clock.start();voice('Mission started.');msg('WAVE 1')}
function over(){run=false;$('hud').style.display='none';save.best=Math.max(save.best,score);save.waveBest=Math.max(save.waveBest,wave);saveIt();voice('Mission over.');$('final').innerHTML=`SCORE <b>${score.toLocaleString()}</b> · WAVE <b>${wave}</b><br>LEVEL <b>${save.level}</b> · CREDITS <b>${save.credits}</b><br>HIGH SCORE <b>${save.best.toLocaleString()}</b>`;$('over').classList.remove('hidden')}
function update(dt){if(!run||paused)return;let x=(keys.right?1:0)-(keys.left?1:0),y=(keys.up?1:0)-(keys.down?1:0);player.position.x=THREE.MathUtils.clamp(player.position.x+x*dt*8,-8,8);player.position.y=THREE.MathUtils.clamp(player.position.y+y*dt*8,-5,6);player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,-x*.25,.12);if(keys.fire)fireShot();spawn-=dt;wtime+=dt;if(!boss&&wave%5===0&&wtime<1)bossSpawn();if(!boss&&spawn<=0){enemy();spawn=Math.max(.23,1.15-wave*.045)}if(!boss&&wtime>20){wave++;wtime=0;msg('WAVE '+wave);voice('Wave '+wave);if(wave%3===0)drop()}
for(let b of [...shots]){b.position.z-=dt*44;if(b.position.z<-65){scene.remove(b);shots.splice(shots.indexOf(b),1);continue}let used=false;for(let e of [...enemies])if(b.position.distanceTo(e.position)<1.15){damageEnemy(e,b.userData.d);scene.remove(b);shots.splice(shots.indexOf(b),1);used=true;break}if(!used&&boss&&b.position.distanceTo(boss.position)<3.1){damageBoss(b.userData.d);scene.remove(b);shots.splice(shots.indexOf(b),1)}}
for(let e of [...enemies]){e.position.z+=e.userData.sp*60*dt;e.rotation.x+=dt;e.rotation.y+=dt*.8;if(e.position.distanceTo(player.position)<1.25){hp-=12;burst(e.position,0xff4d6d,14);scene.remove(e);enemies.splice(enemies.indexOf(e),1)}else if(e.position.z>8){hp-=8;scene.remove(e);enemies.splice(enemies.indexOf(e),1)}}
if(boss){boss.position.x=Math.sin(performance.now()*.0007)*6;boss.position.y=2+Math.sin(performance.now()*.001)*2;boss.rotation.y+=dt*.5;boss.userData.t-=dt;if(boss.userData.t<=0){boss.userData.t=.7;let b=new THREE.Mesh(new THREE.SphereGeometry(.16,8,8),new THREE.MeshBasicMaterial({color:0xff4fd8}));b.position.copy(boss.position);bossShots.push(b);scene.add(b)}$('bossFill').style.width=Math.max(0,boss.userData.hp/boss.userData.max*100)+'%'}
for(let b of [...bossShots]){b.position.z+=dt*20;if(b.position.distanceTo(player.position)<1.1){hp-=10;shake=.18;burst(player.position,0xff4d6d,10);scene.remove(b);bossShots.splice(bossShots.indexOf(b),1)}else if(b.position.z>15){scene.remove(b);bossShots.splice(bossShots.indexOf(b),1)}}
for(let p of [...parts]){p.userData.life-=dt;p.position.addScaledVector(p.userData.v,dt*60);p.material.opacity=Math.max(0,p.userData.life);if(p.userData.life<=0){scene.remove(p);parts.splice(parts.indexOf(p),1)}}for(let p of [...drops]){p.position.z+=dt*8;p.rotation.z+=dt*2;p.userData.life-=dt;if(p.position.distanceTo(player.position)<1.4){if(p.userData.kind==='health')hp=Math.min(100,hp+30);else rapid=performance.now()+8000;score+=50;sfx('pick');msg(p.userData.kind==='health'?'+ HEALTH':'RAPID FIRE');scene.remove(p);drops.splice(drops.indexOf(p),1)}else if(p.userData.life<=0||p.position.z>8){scene.remove(p);drops.splice(drops.indexOf(p),1)}}
hp=Math.max(0,hp);$('score').textContent=score.toLocaleString();$('wave').textContent=wave;$('hp').textContent=Math.ceil(hp);$('wep').textContent='L'+save.weapon;$('cred').textContent=save.credits;if(hp<=0)over()}
function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.033);update(dt);for(let s of stars)s.rotation.y+=dt*.003;if(shake>0){shake=Math.max(0,shake-dt);camera.position.x=(Math.random()-.5)*shake;camera.position.y=3.8+(Math.random()-.5)*shake}else{camera.position.x=0;camera.position.y=3.8}renderer.render(scene,camera)}
function buy(k){let price={damage:150+save.damage*100,fire:150+save.fire*100,shield:200+save.shield*150,weapon:300+save.weapon*250}[k];if(save.credits<price||(k==='weapon'&&save.weapon>=5)||(k!=='weapon'&&save[k]>=5))return;save.credits-=price;save[k]++;saveIt();upgrades();sfx('pick')}
function upgrades(){let a=[['damage','Damage','More shot damage'],['fire','Fire Rate','Shoot faster'],['shield','Shield','More starting health'],['weapon','Weapon','Unlock multi-shot']];$('upList').innerHTML=a.map(([k,n,d])=>{let max=k==='weapon'?save.weapon>=5:save[k]>=5,p={damage:150+save.damage*100,fire:150+save.fire*100,shield:200+save.shield*150,weapon:300+save.weapon*250}[k];return `<div class="item"><b>${n} · L${save[k]}</b><small>${d}</small><button class="btn" data-buy="${k}" ${max||save.credits<p?'disabled':''}>${max?'MAX':'BUY · '+p}</button></div>`}).join('');document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy))}
function achievements(){$('achList').innerHTML=ach.map(a=>`<div class="item ${save.ach[a[0]]?'':'locked'}"><b>${save.ach[a[0]]?'🏆':'🔒'} ${a[1]}</b><small>${a[2]}</small></div>`).join('')}
function events(){addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});addEventListener('pointerdown',audioOn);addEventListener('keydown',e=>{let k=e.key.toLowerCase();if('wasd p'.includes(k)||k.startsWith('arrow')||k===' ')e.preventDefault();if(k==='p'){paused=!paused;$('pause').textContent=paused?'RESUME':'PAUSE';if(paused)voice('Game paused.');else voice('Resume.')}if(k===' ')keys.fire=true;if(k==='w'||k==='arrowup')keys.up=true;if(k==='s'||k==='arrowdown')keys.down=true;if(k==='a'||k==='arrowleft')keys.left=true;if(k==='d'||k==='arrowright')keys.right=true});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k===' ')keys.fire=false;if(k==='w'||k==='arrowup')keys.up=false;if(k==='s'||k==='arrowdown')keys.down=false;if(k==='a'||k==='arrowleft')keys.left=false;if(k==='d'||k==='arrowright')keys.right=false});$('startBtn').onclick=start;$('again').onclick=start;$('menu').onclick=()=>{$('over').classList.add('hidden');$('start').classList.remove('hidden');menu()};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'RESUME':'PAUSE'};$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent='SOUND: '+(sound?'ON':'OFF');if(sound){audioOn();voice('Audio enabled.')}};$('upBtn').onclick=()=>{$('start').classList.add('hidden');$('upScreen').classList.remove('hidden');upgrades()};$('upBack').onclick=()=>{$('upScreen').classList.add('hidden');$('start').classList.remove('hidden')};$('achBtn').onclick=()=>{$('start').classList.add('hidden');$('achScreen').classList.remove('hidden');achievements()};$('achBack').onclick=()=>{$('achScreen').classList.add('hidden');$('start').classList.remove('hidden')};document.querySelectorAll('.touch').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();audioOn();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>keys[k]=false))});$('fire').addEventListener('pointerdown',e=>{e.preventDefault();audioOn();keys.fire=true});['pointerup','pointercancel','pointerleave'].forEach(v=>$('fire').addEventListener(v,()=>keys.fire=false))}
init();</script></body></html>
