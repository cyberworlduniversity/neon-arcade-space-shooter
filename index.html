<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Arcade Space Shooter</title>
<style>
:root{--cyan:#42f5ff;--pink:#ff4fd8;--lime:#a8ff5a;--orange:#ff9d3b;--panel:rgba(4,8,25,.88)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040d;color:#fff;font-family:Inter,system-ui,sans-serif;touch-action:none}canvas{display:block}
.hidden{display:none!important}.screen{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(40,30,100,.38),rgba(1,3,10,.95) 68%);z-index:8}.card{width:min(94vw,720px);max-height:90vh;overflow:auto;padding:30px;border:1px solid rgba(66,245,255,.35);border-radius:26px;background:var(--panel);box-shadow:0 0 80px rgba(66,245,255,.13);text-align:center}.title{font-size:clamp(40px,9vw,80px);line-height:.9;margin:0 0 14px;font-weight:1000;letter-spacing:-4px;background:linear-gradient(90deg,var(--cyan),#fff,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}.subtitle{opacity:.72}.btn{border:0;border-radius:13px;padding:13px 22px;margin:5px;background:linear-gradient(90deg,#13d9ff,#9b5cff);color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 0 25px rgba(66,245,255,.2)}.btn.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}.btn:disabled{opacity:.4;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:left;margin:18px 0}.upgrade{padding:14px;border:1px solid rgba(66,245,255,.2);border-radius:15px;background:rgba(255,255,255,.035)}.upgrade b{color:var(--cyan)}.upgrade small{display:block;opacity:.65;margin:5px 0 10px}.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:15px 0}.pill{padding:8px 12px;border:1px solid rgba(255,255,255,.15);border-radius:999px;background:rgba(255,255,255,.05);font-size:12px}
#hud{position:fixed;inset:0;pointer-events:none;padding:12px;display:none;z-index:4}.top{display:flex;justify-content:space-between;gap:7px}.stat{min-width:84px;padding:8px 10px;border:1px solid rgba(66,245,255,.3);border-radius:12px;background:rgba(5,10,28,.78);backdrop-filter:blur(8px)}.label{font-size:9px;text-transform:uppercase;letter-spacing:1.3px;opacity:.6}.value{font-size:17px;font-weight:900;color:var(--cyan)}#health{color:var(--lime)}#bossBar{position:absolute;top:86px;left:50%;transform:translateX(-50%);width:min(70vw,560px);display:none}.bar{height:13px;border-radius:99px;background:#170612;border:1px solid rgba(255,79,216,.4);overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#ff4fd8,#ff3b6b);transition:width .15s}.barLabel{text-align:center;font-size:11px;margin-bottom:4px;letter-spacing:2px;font-weight:900}.msg{position:absolute;top:20%;left:50%;transform:translateX(-50%);font-weight:1000;font-size:clamp(18px,4vw,38px);letter-spacing:3px;text-shadow:0 0 20px var(--cyan);opacity:0;transition:.2s;white-space:nowrap}.pause{pointer-events:auto;position:fixed;right:12px;bottom:12px;border:1px solid rgba(255,255,255,.25);background:var(--panel);color:#fff;border-radius:12px;padding:10px 14px;font-weight:900}
#touch{position:fixed;inset:auto 0 15px;display:none;justify-content:space-between;padding:0 15px;pointer-events:none;z-index:5}.pad{display:grid;grid-template-columns:repeat(3,43px);grid-template-rows:repeat(3,43px);gap:4px}.touch{pointer-events:auto;width:43px;height:43px;border:1px solid rgba(255,255,255,.25);border-radius:12px;background:rgba(8,15,35,.72);color:#fff;font-size:17px}.fire{pointer-events:auto;width:88px;height:88px;border-radius:50%;border:2px solid var(--pink);background:rgba(255,79,216,.13);color:#fff;font-weight:1000;box-shadow:0 0 28px rgba(255,79,216,.25)}
.achievement{padding:10px;text-align:left;border:1px solid rgba(168,255,90,.22);border-radius:12px;margin:7px 0;background:rgba(168,255,90,.04)}.achievement.locked{opacity:.38;filter:grayscale(1)}
@media(max-width:700px){#touch{display:flex}.stat{min-width:65px;padding:6px 8px}.value{font-size:14px}.label{font-size:7px}.grid{grid-template-columns:1fr}.card{padding:22px}.pause{bottom:115px}}
</style>
</head>
<body>
<div id="start" class="screen"><div class="card"><h1 class="title">NEON<br>ARCADE</h1><p class="subtitle">3D SPACE SHOOTER // BOSS RUN</p><div class="stats"><span class="pill">LEVEL <b id="menuLevel">1</b></span><span class="pill">XP <b id="menuXp">0</b></span><span class="pill">CREDITS <b id="menuCredits">0</b></span><span class="pill">HIGH SCORE <b id="menuBest">0</b></span></div><button id="startBtn" class="btn">START MISSION</button><button id="upgradeBtn" class="btn secondary">UPGRADES</button><button id="achBtn" class="btn secondary">ACHIEVEMENTS</button><p class="subtitle">WASD / ARROWS = MOVE · SPACE = FIRE · P = PAUSE</p></div></div>
<div id="upgradeScreen" class="screen hidden"><div class="card"><h2>WEAPON & SHIP UPGRADES</h2><p class="subtitle">Spend persistent credits between missions.</p><div class="grid" id="upgradeGrid"></div><button class="btn secondary" id="upgradeBack">BACK</button></div></div>
<div id="achScreen" class="screen hidden"><div class="card"><h2>ACHIEVEMENTS</h2><div id="achList"></div><button class="btn secondary" id="achBack">BACK</button></div></div>
<div id="gameover" class="screen hidden"><div class="card"><h2 class="title" style="font-size:clamp(42px,8vw,70px)">MISSION OVER</h2><p id="finalStats"></p><button id="restartBtn" class="btn">PLAY AGAIN</button><button id="menuBtn" class="btn secondary">MAIN MENU</button></div></div>
<div id="hud"><div class="top"><div class="stat"><div class="label">Score</div><div id="score" class="value">0</div></div><div class="stat"><div class="label">Wave</div><div id="wave" class="value">1</div></div><div class="stat"><div class="label">Health</div><div id="health" class="value">100</div></div><div class="stat"><div class="label">Weapon</div><div id="weapon" class="value">L1</div></div><div class="stat"><div class="label">Credits</div><div id="credits" class="value">0</div></div></div><div id="bossBar"><div id="bossLabel" class="barLabel">BOSS</div><div class="bar"><div id="bossFill" class="fill"></div></div></div><div id="message" class="msg"></div><button id="pauseBtn" class="pause">PAUSE</button></div>
<div id="touch"><div class="pad"><span></span><button class="touch" data-key="up">▲</button><span></span><button class="touch" data-key="left">◀</button><button class="touch" data-key="down">▼</button><button class="touch" data-key="right">▶</button></div><button id="fireTouch" class="fire">FIRE</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const $=id=>document.getElementById(id);const SAVE='neonArcadeSaveV2';
const defaults={level:1,xp:0,credits:0,best:0,damage:1,fire:1,shield:0,weapon:1,kills:0,bosses:0,ach:{},waveBest:0};
let save=load(),scene,camera,renderer,clock,player;let stars=[],shots=[],enemies=[],particles=[],powerups=[],boss=null,bossShots=[];let running=false,paused=false,score=0,health=100,wave=1,lastShot=0,spawnTimer=0,waveTimer=0,rapidUntil=0;let keys={};
const achievements=[['first','First Blood','Destroy 1 enemy',()=>save.kills>=1],['wave5','Wave Runner','Reach wave 5',()=>save.waveBest>=5],['boss','Boss Breaker','Defeat a boss',()=>save.bosses>=1],['arsenal','Arsenal','Reach weapon level 5',()=>save.weapon>=5],['rich','Credit Hunter','Earn 1000 credits',()=>save.totalCredits>=1000],['veteran','Veteran','Reach progression level 5',()=>save.level>=5]];
function load(){try{const x=JSON.parse(localStorage.getItem(SAVE)||'{}');return {...defaults,...x,ach:{...defaults.ach,...(x.ach||{})}}}catch{return {...defaults,ach:{}}}}
function persist(){localStorage.setItem(SAVE,JSON.stringify(save));updateMenu()}
function updateMenu(){$('menuLevel').textContent=save.level;$('menuXp').textContent=save.xp;$('menuCredits').textContent=save.credits;$('menuBest').textContent=save.best.toLocaleString()}
function init(){scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02040d,.012);camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);camera.position.set(0,4,12);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);clock=new THREE.Clock();scene.add(new THREE.AmbientLight(0x5260aa,1.5));const l=new THREE.PointLight(0x42f5ff,50,130);l.position.set(0,8,10);scene.add(l);makeStars();makePlayer();events();renderLoop();updateMenu();renderUpgrades();renderAchievements()}
function makeStars(){const g=new THREE.BufferGeometry(),p=[];for(let i=0;i<1600;i++)p.push((Math.random()-.5)*190,(Math.random()-.5)*110,-Math.random()*240);g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));const m=new THREE.PointsMaterial({color:0x9eeeff,size:.14,transparent:true,opacity:.85});const s=new THREE.Points(g,m);scene.add(s);stars.push(s)}
function makePlayer(){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.ConeGeometry(.72,2.6,4),new THREE.MeshStandardMaterial({color:0x22d9ff,emissive:0x063b70,emissiveIntensity:2,metalness:.5,roughness:.25}));body.rotation.x=-Math.PI/2;g.add(body);const wing=new THREE.Mesh(new THREE.BoxGeometry(2.3,.12,.7),new THREE.MeshStandardMaterial({color:0xff4fd8,emissive:0x4b0038,emissiveIntensity:2}));wing.position.z=.25;g.add(wing);const glow=new THREE.PointLight(0x42f5ff,7,14);glow.position.z=1.2;g.add(glow);g.position.set(0,0,5);player=g;scene.add(player)}
function shoot(){const now=performance.now(),cooldown=Math.max(55,135-(save.fire-1)*15)-(rapidUntil>now?55:0);if(now-lastShot<cooldown)return;lastShot=now;const count=save.weapon>=4?3:save.weapon>=2?2:1;for(let i=0;i<count;i++){const b=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),new THREE.MeshBasicMaterial({color:save.weapon>=5?0xa8ff5a:0x42f5ff}));b.position.copy(player.position);b.position.x+=(i-(count-1)/2)*.28;b.position.z-=1.5;b.userData.damage=save.damage+Math.floor(save.weapon/3);shots.push(b);scene.add(b);burst(b.position,b.material.color.getHex(),3)}}
function spawnEnemy(){const r=Math.random();let e;if(r<.6){e=new THREE.Mesh(new THREE.OctahedronGeometry(.8),new THREE.MeshStandardMaterial({color:0xff4fd8,emissive:0x52002f,emissiveIntensity:2}));e.userData={hp:1+Math.floor(wave/7),speed:.075+wave*.007,kind:'scout',value:100}}else if(r<.88){e=new THREE.Mesh(new THREE.IcosahedronGeometry(1.12),new THREE.MeshStandardMaterial({color:0xff9d3b,emissive:0x4c1700,emissiveIntensity:1.8}));e.userData={hp:2+Math.floor(wave/6),speed:.045+wave*.005,kind:'heavy',value:180}}else{e=new THREE.Mesh(new THREE.TetrahedronGeometry(1.1),new THREE.MeshStandardMaterial({color:0xa8ff5a,emissive:0x143b00,emissiveIntensity:2}));e.userData={hp:3+Math.floor(wave/5),speed:.035+wave*.004,kind:'elite',value:300}}e.position.set((Math.random()-.5)*16,(Math.random()-.5)*8,-45-Math.random()*35);enemies.push(e);scene.add(e)}
function spawnBoss(){if(boss)return;const g=new THREE.Group();const core=new THREE.Mesh(new THREE.IcosahedronGeometry(2.7,1),new THREE.MeshStandardMaterial({color:0xff2c9c,emissive:0x650035,emissiveIntensity:2.5,metalness:.4}));g.add(core);const ring=new THREE.Mesh(new THREE.TorusGeometry(3.5,.16,12,48),new THREE.MeshBasicMaterial({color:0x42f5ff}));ring.rotation.x=Math.PI/2;g.add(ring);g.position.set(0,2,-48);g.userData={hp:120+wave*35,max:120+wave*35,fire:0};boss=g;scene.add(g);$('bossBar').style.display='block';showMessage('BOSS INCOMING')}
function burst(pos,color=0x42f5ff,n=14){for(let i=0;i<n;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.07,5,5),new THREE.MeshBasicMaterial({color,transparent:true}));p.position.copy(pos);p.userData={life:.45+Math.random()*.6,v:new THREE.Vector3((Math.random()-.5)*.18,(Math.random()-.5)*.18,(Math.random()-.5)*.18)};particles.push(p);scene.add(p)}}
function powerup(){const p=new THREE.Mesh(new THREE.TorusGeometry(.42,.11,8,18),new THREE.MeshBasicMaterial({color:0xa8ff5a}));p.position.set((Math.random()-.5)*13,(Math.random()-.5)*7,-40);p.userData={kind:Math.random()<.5?'health':'rapid',life:10};powerups.push(p);scene.add(p)}
function hitEnemy(e,dmg){e.userData.hp-=dmg;burst(e.position,e.material.color.getHex(),5);if(e.userData.hp<=0){score+=e.userData.value;save.kills++;save.xp+=25;save.credits+=Math.ceil(e.userData.value/20);save.totalCredits=(save.totalCredits||0)+Math.ceil(e.userData.value/20);burst(e.position,e.material.color.getHex(),22);if(Math.random()<.13)powerup();scene.remove(e);enemies.splice(enemies.indexOf(e),1);progress()}}
function hitBoss(dmg){if(!boss)return;boss.userData.hp-=dmg;burst(boss.position,0xff4fd8,4);if(boss.userData.hp<=0){score+=2500;save.bosses++;save.xp+=300;save.credits+=250;save.totalCredits=(save.totalCredits||0)+250;burst(boss.position,0xff4fd8,70);scene.remove(boss);boss=null;$('bossBar').style.display='none';showMessage('BOSS DESTROYED +250 XP');progress()}}
function progress(){while(save.xp>=save.level*250){save.xp-=save.level*250;save.level++;save.credits+=100;save.totalCredits=(save.totalCredits||0)+100;showMessage('LEVEL UP +100 CREDITS')}checkAchievements();persist()}
function checkAchievements(){for(const a of achievements)if(!save.ach[a[0]]&&a[3]()){save.ach[a[0]]=Date.now();showMessage('ACHIEVEMENT: '+a[1])}renderAchievements()}
function gameOver(){running=false;$('hud').style.display='none';const hi=Math.max(save.best,score);save.best=hi;save.waveBest=Math.max(save.waveBest||0,wave);persist();$('finalStats').innerHTML=`SCORE <b>${score.toLocaleString()}</b> · WAVE <b>${wave}</b><br>LEVEL <b>${save.level}</b> · CREDITS <b>${save.credits}</b><br>HIGH SCORE <b>${hi.toLocaleString()}</b>`;$('gameover').classList.remove('hidden')}
function clearObjects(){for(const a of [...enemies,...shots,...particles,...powerups,...bossShots])scene.remove(a);if(boss)scene.remove(boss);enemies=[];shots=[];particles=[];powerups=[];bossShots=[];boss=null;$('bossBar').style.display='none'}
function reset(){clearObjects();score=0;health=Math.min(100,100+save.shield*10);wave=1;spawnTimer=0;waveTimer=0;rapidUntil=0;player.position.set(0,0,5);$('score').textContent=0;$('health').textContent=health;$('wave').textContent=1;$('weapon').textContent='L'+save.weapon;$('credits').textContent=save.credits}
function start(){reset();running=true;paused=false;$('start').classList.add('hidden');$('gameover').classList.add('hidden');$('hud').style.display='block';clock.start();showMessage('WAVE 1')}
function showMessage(t){$('message').textContent=t;$('message').style.opacity=1;clearTimeout(showMessage.t);showMessage.t=setTimeout(()=>$('message').style.opacity=0,1000)}
function togglePause(){if(!running)return;paused=!paused;$('pauseBtn').textContent=paused?'RESUME':'PAUSE';if(paused)showMessage('PAUSED')}
function update(dt){if(!running||paused)return;const speed=dt*8,x=(keys.right?1:0)-(keys.left?1:0),y=(keys.up?1:0)-(keys.down?1:0);player.position.x=THREE.MathUtils.clamp(player.position.x+x*speed,-8,8);player.position.y=THREE.MathUtils.clamp(player.position.y+y*speed,-5,6);player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,-x*.25,.12);if(keys.fire)shoot();spawnTimer-=dt;waveTimer+=dt;if(!boss&&wave%5===0&&waveTimer<1)spawnBoss();if(!boss&&spawnTimer<=0){spawnEnemy();spawnTimer=Math.max(.25,1.15-wave*.045)}if(!boss&&waveTimer>20){wave++;waveTimer=0;showMessage('WAVE '+wave);if(wave%3===0)powerup()}
for(const s of [...shots]){s.position.z-=dt*42;if(s.position.z<-65){scene.remove(s);shots.splice(shots.indexOf(s),1);continue}let used=false;for(const e of [...enemies])if(s.position.distanceTo(e.position)<1.15){hitEnemy(e,s.userData.damage);scene.remove(s);shots.splice(shots.indexOf(s),1);used=true;break}if(!used&&boss&&s.position.distanceTo(boss.position)<3.1){hitBoss(s.userData.damage);scene.remove(s);shots.splice(shots.indexOf(s),1)}}
for(const e of [...enemies]){e.position.z+=e.userData.speed*60*dt;e.rotation.x+=dt;e.rotation.y+=dt*.8;if(e.position.distanceTo(player.position)<1.25){health-=e.userData.kind==='elite'?18:10;burst(e.position,0xff4d6d,14);scene.remove(e);enemies.splice(enemies.indexOf(e),1)}else if(e.position.z>8){health-=8;scene.remove(e);enemies.splice(enemies.indexOf(e),1)}}
if(boss){boss.position.x=Math.sin(performance.now()*.0007)*6;boss.position.y=2+Math.sin(performance.now()*.001)*2;boss.rotation.y+=dt*.5;boss.userData.fire-=dt;if(boss.userData.fire<=0){boss.userData.fire=.7;const b=new THREE.Mesh(new THREE.SphereGeometry(.16,8,8),new THREE.MeshBasicMaterial({color:0xff4fd8}));b.position.copy(boss.position);bossShots.push(b);scene.add(b)}$('bossFill').style.width=Math.max(0,boss.userData.hp/boss.userData.max*100)+'%'}
for(const b of [...bossShots]){b.position.z+=dt*20;if(b.position.distanceTo(player.position)<1.1){health-=10;burst(player.position,0xff4d6d,10);scene.remove(b);bossShots.splice(bossShots.indexOf(b),1)}else if(b.position.z>15){scene.remove(b);bossShots.splice(bossShots.indexOf(b),1)}}
for(const p of [...particles]){p.userData.life-=dt;p.position.addScaledVector(p.userData.v,dt*60);p.material.opacity=Math.max(0,p.userData.life);if(p.userData.life<=0){scene.remove(p);particles.splice(particles.indexOf(p),1)}}
for(const p of [...powerups]){p.position.z+=dt*8;p.rotation.z+=dt*2;p.userData.life-=dt;if(p.position.distanceTo(player.position)<1.4){if(p.userData.kind==='health')health=Math.min(100,health+30);else rapidUntil=performance.now()+8000;score+=50;showMessage(p.userData.kind==='health'?'+ HEALTH':'RAPID FIRE');scene.remove(p);powerups.splice(powerups.indexOf(p),1)}else if(p.userData.life<=0||p.position.z>8){scene.remove(p);powerups.splice(powerups.indexOf(p),1)}}
health=Math.max(0,health);$('score').textContent=score.toLocaleString();$('health').textContent=Math.ceil(health);$('wave').textContent=wave;$('weapon').textContent='L'+save.weapon;$('credits').textContent=save.credits;if(health<=0)gameOver()}
function renderLoop(){requestAnimationFrame(renderLoop);const dt=Math.min(clock.getDelta(),.033);update(dt);renderer.render(scene,camera)}
function buy(type){const prices={damage:150+save.damage*100,fire:150+save.fire*100,shield:200+save.shield*150,weapon:300+save.weapon*250};const p=prices[type];if(save.credits<p)return;if(type==='weapon'&&save.weapon>=5)return;if(type!=='weapon'&&save[type]>=5)return;save.credits-=p;save[type]++;persist();renderUpgrades();checkAchievements()}
function renderUpgrades(){const items=[['damage','Damage','Increase shot damage'],['fire','Fire Rate','Shoot faster'],['shield','Shield','Increase starting health'],['weapon','Weapon','Unlock stronger multi-shot patterns']];$('upgradeGrid').innerHTML=items.map(([k,n,d])=>{const max=k==='weapon'?save.weapon>=5:save[k]>=5;const price={damage:150+save.damage*100,fire:150+save.fire*100,shield:200+save.shield*150,weapon:300+save.weapon*250}[k];return `<div class="upgrade"><b>${n} · L${save[k]}</b><small>${d}</small><button class="btn" data-buy="${k}" ${max||save.credits<price?'disabled':''}>${max?'MAX':'BUY · '+price}</button></div>`}).join('');$('upgradeGrid').querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy))}
function renderAchievements(){$('achList').innerHTML=achievements.map(a=>`<div class="achievement ${save.ach[a[0]]?'':'locked'}"><b>${save.ach[a[0]]?'🏆':'🔒'} ${a[1]}</b><br><small>${a[2]}</small></div>`).join('')}
function events(){addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' ','p'].includes(k))e.preventDefault();if(k==='p')togglePause();if(k===' ')keys.fire=true;if(k==='w'||k==='arrowup')keys.up=true;if(k==='s'||k==='arrowdown')keys.down=true;if(k==='a'||k==='arrowleft')keys.left=true;if(k==='d'||k==='arrowright')keys.right=true});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k===' ')keys.fire=false;if(k==='w'||k==='arrowup')keys.up=false;if(k==='s'||k==='arrowdown')keys.down=false;if(k==='a'||k==='arrowleft')keys.left=false;if(k==='d'||k==='arrowright')keys.right=false});$('startBtn').onclick=start;$('restartBtn').onclick=start;$('menuBtn').onclick=()=>{$('gameover').classList.add('hidden');$('start').classList.remove('hidden');updateMenu()};$('pauseBtn').onclick=togglePause;$('upgradeBtn').onclick=()=>{$('start').classList.add('hidden');$('upgradeScreen').classList.remove('hidden');renderUpgrades()};$('upgradeBack').onclick=()=>{$('upgradeScreen').classList.add('hidden');$('start').classList.remove('hidden');updateMenu()};$('achBtn').onclick=()=>{$('start').classList.add('hidden');$('achScreen').classList.remove('hidden');renderAchievements()};$('achBack').onclick=()=>{$('achScreen').classList.add('hidden');$('start').classList.remove('hidden');updateMenu()};document.querySelectorAll('.touch').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});$('fireTouch').addEventListener('pointerdown',e=>{e.preventDefault();keys.fire=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('fireTouch').addEventListener(ev,()=>keys.fire=false))}
init();
</script>
</body>
</html>
